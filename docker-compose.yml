services:
  key-qc:
    image: ghcr.io/sagabeats/key-qc:prod
    # build: .
    restart: always
    env_file:
      - .env
    expose:
      - "8080"
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.key-qc.loadbalancer.server.port=8080"

      - "traefik.http.routers.key-qc.rule=Host(`${KEY_QC_DOMAIN}`)"
      - "traefik.http.routers.key-qc.entrypoints=websecure"
      - "traefik.http.routers.key-qc.tls.certresolver=myresolver"
      - "traefik.http.routers.key-qc.service=key-qc"
      - "traefik.http.routers.key-qc.middlewares=crowdsec@docker,key-qc-ratelimit@docker"

      - "traefik.http.middlewares.key-qc-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.key-qc-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.key-qc-ratelimit.ratelimit.burst=20"

      - "com.centurylinklabs.watchtower.enable=true"

networks:
  default:
    name: project-network
    external: true
